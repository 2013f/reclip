<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReClip — معاينة المشروع</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #121212;
      --fg: #f4f1eb;
      --accent: #e85d2a;
      --accent-hover: #d04e1f;
      --muted: #9c9889;
      --card: #1e1e1e;
      --card-border: #2a2a2a;
      --radius: 14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page {
      max-width: 620px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px;
      text-align: center;
    }

    .brand { margin-bottom: 32px; }
    .brand h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 4.2rem;
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--fg);
    }
    .brand h1 em { font-style: italic; color: var(--accent); }
    .brand p {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .video-container {
      background: var(--card);
      border: 1.5px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    video {
      width: 100%;
      border-radius: 8px;
      display: block;
    }

    .footer {
      margin-top: 32px;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      line-height: 1.8;
    }

    @media (max-width: 500px) {
      .brand h1 { font-size: 3rem; }
      .page { padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="brand">
      <h1>Re<em>Clip</em></h1>
      <p>معاينة فيديو المشروع</p>
    </div>

    <div class="video-container">
      <!-- استخدام مسار الفيديو المباشر في المجلد الرئيسي -->
      <video controls autoplay loop muted preload="auto">
        <source src="preview.mp4" type="video/mp4">
        متصفحك لا يدعم تشغيل هذا الفيديو.
      </video>
    </div>

    <div class="footer">
      YouTube &middot; TikTok &middot; Instagram &middot; Twitter/X &middot; Facebook<br>
      مشروع مفتوح المصدر لمعالجة وتحميل الوسائط
    </div>
  </div>
</body>
</html>
